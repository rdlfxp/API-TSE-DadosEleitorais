name: Data Refresh

on:
  workflow_dispatch:
    inputs:
      normalize_years:
        description: "Anos para normalizacao (separados por espaco)"
        required: false
        default: "2000 2002 2004 2006 2008 2010 2012 2014 2016 2018 2020 2022 2024 2026"
        type: string
      publish_to_r2:
        description: "Publicar curated/snapshots no Cloudflare R2"
        required: false
        default: true
        type: boolean
      keep_snapshots:
        description: "Qtd de snapshots remotos para manter no R2"
        required: false
        default: "7"
        type: string
      incremental_year:
        description: "Atualiza somente esta partição (ex.: 2026); vazio executa carga completa"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 9 * * 1"

jobs:
  normalize-and-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch configured TSE sources
        run: |
          INCREMENTAL_YEAR="${{ inputs.incremental_year || '' }}"
          if [ -n "${{ secrets.TSE_SOURCES_JSON }}" ]; then
            printf '%s' '${{ secrets.TSE_SOURCES_JSON }}' > /tmp/tse_sources.json
            FETCH_ARGS=(--config /tmp/tse_sources.json --raw-dir data/raw --timeout 180 --retries 3)
          elif [ -f config/tse_sources.json ]; then
            FETCH_ARGS=(--config config/tse_sources.json --raw-dir data/raw --timeout 180 --retries 3)
          else
            echo "No remote source config found (secret/local file); skipping remote fetch."
            FETCH_ARGS=()
          fi
          if [ -n "$INCREMENTAL_YEAR" ] && [ "${#FETCH_ARGS[@]}" -gt 0 ]; then
            FETCH_ARGS+=(--target-year "$INCREMENTAL_YEAR")
          fi
          if [ "${#FETCH_ARGS[@]}" -gt 0 ]; then
            python -u scripts/fetch_sources.py "${FETCH_ARGS[@]}"
          fi

      - name: Check raw data availability
        id: raw_check
        run: |
          CSV_COUNT=$(find data/raw -type f -name '*.csv' | wc -l | tr -d ' ')
          echo "csv_count=$CSV_COUNT" >> "$GITHUB_OUTPUT"
          echo "CSV files found: $CSV_COUNT"

      - name: Download base snapshot for incremental refresh
        if: steps.raw_check.outputs.csv_count != '0' && inputs.incremental_year != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          test -n "$R2_ACCOUNT_ID" -a -n "$R2_ACCESS_KEY_ID" -a -n "$R2_SECRET_ACCESS_KEY" -a -n "$R2_BUCKET"
          python scripts/download_curated_from_r2.py \
            --account-id "$R2_ACCOUNT_ID" \
            --access-key-id "$R2_ACCESS_KEY_ID" \
            --secret-access-key "$R2_SECRET_ACCESS_KEY" \
            --bucket "$R2_BUCKET"

      - name: Normalize raw data (full)
        if: steps.raw_check.outputs.csv_count != '0' && inputs.incremental_year == ''
        run: |
          NORMALIZE_YEARS="${{ inputs.normalize_years || '2000 2002 2004 2006 2008 2010 2012 2014 2016 2018 2020 2022 2024 2026' }}"
          echo "Normalize years: $NORMALIZE_YEARS"
          python scripts/normalize.py \
            --raw-dir data/raw \
            --years $NORMALIZE_YEARS \
            --chunk-size 250000 \
            --quality-gate \
            --max-duplicate-rows 0 \
            --max-negative-votes 0 \
            --max-required-null-rate 0.02 \
            --output data/curated/analytics.csv \
            --report data/curated/quality_report.json \
            --manifest data/curated/manifest.json

      - name: Normalize incremental partition
        if: steps.raw_check.outputs.csv_count != '0' && inputs.incremental_year != ''
        run: |
          YEAR="${{ inputs.incremental_year }}"
          python scripts/normalize.py \
            --raw-dir data/raw \
            --years "$YEAR" \
            --chunk-size 250000 \
            --output "data/curated/analytics_${YEAR}.parquet" \
            --report "data/curated/quality_report_${YEAR}.json" \
            --manifest "data/curated/manifest_${YEAR}.json" \
            --quality-gate \
            --max-duplicate-rows 0 \
            --max-negative-votes 0 \
            --max-required-null-rate 0.02

      - name: Merge incremental partition
        if: steps.raw_check.outputs.csv_count != '0' && inputs.incremental_year != ''
        run: |
          YEAR="${{ inputs.incremental_year }}"
          python scripts/merge_curated_year.py \
            --base data/curated/analytics.parquet \
            --year-file "data/curated/analytics_${YEAR}.parquet" \
            --target-year "$YEAR" \
            --historico "data/raw/${YEAR}/historico_candidatura_${YEAR}_BRASIL.csv" \
            --output data/curated/analytics.with-incremental.parquet \
            --history-output data/curated/candidate_history.with-incremental.parquet \
            --report data/curated/quality_report.json \
            --manifest data/curated/manifest.json
          mv data/curated/analytics.with-incremental.parquet data/curated/analytics.parquet
          mv data/curated/candidate_history.with-incremental.parquet data/curated/candidate_history.parquet

      - name: Convert curated CSV to Parquet
        if: steps.raw_check.outputs.csv_count != '0' && inputs.incremental_year == ''
        run: |
          python scripts/convert_csv_to_parquet.py \
            --input data/curated/analytics.csv \
            --output data/curated/analytics.parquet \
            --delimiter ","

      - name: Validate API endpoints (legacy years)
        if: steps.raw_check.outputs.csv_count != '0'
        run: |
          ANALYTICS_ENGINE=duckdb \
          ANALYTICS_DATA_PATH=data/curated/analytics.parquet \
          PREFER_PARQUET_IF_AVAILABLE=true \
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn_data_refresh.log 2>&1 &
          UVICORN_PID=$!
          trap 'kill $UVICORN_PID || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done

          python scripts/validate_endpoints_full.py \
            --base-url http://127.0.0.1:8000 \
            --legacy-year 2016 \
            --target-year 2026

      - name: Publish snapshot
        if: steps.raw_check.outputs.csv_count != '0'
        run: python scripts/publish_snapshot.py

      - name: Go/No-Go validation
        if: steps.raw_check.outputs.csv_count != '0'
        run: |
          ANALYTICS_VALIDATION_FILE="data/curated/analytics.csv"
          if [ -n "${{ inputs.incremental_year }}" ]; then
            ANALYTICS_VALIDATION_FILE="data/curated/analytics.parquet"
          fi
          python scripts/go_no_go.py \
            --analytics "$ANALYTICS_VALIDATION_FILE" \
            --quality-report data/curated/quality_report.json \
            --manifest data/curated/manifest.json \
            --expected-years 2000 2002 2004 2006 2008 2010 2012 2014 2016 2018 2020 2022 2024 2026 \
            --require-release \
            --max-duplicate-rows 0 \
            --max-negative-votes 0 \
            --max-required-null-rate 0.02

      - name: Upload curated artifacts
        if: steps.raw_check.outputs.csv_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: curated-output
          path: |
            data/curated/analytics.csv
            data/curated/analytics.parquet
            data/curated/candidate_history.parquet
            data/curated/quality_report.json
            data/curated/manifest.json

      - name: Upload release snapshots
        if: steps.raw_check.outputs.csv_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: releases
          path: data/releases

      - name: Publish curated/snapshots to Cloudflare R2
        if: steps.raw_check.outputs.csv_count != '0'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          PUBLISH_TO_R2="${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_r2 }}"
          KEEP_SNAPSHOTS="${{ inputs.keep_snapshots || '7' }}"

          if [ "$PUBLISH_TO_R2" != "true" ]; then
            echo "R2 publish disabled for this run."
            exit 0
          fi

          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 secrets are missing; skipping R2 publish."
            exit 0
          fi

          python scripts/upload_to_r2.py \
            --account-id "$R2_ACCOUNT_ID" \
            --access-key-id "$R2_ACCESS_KEY_ID" \
            --secret-access-key "$R2_SECRET_ACCESS_KEY" \
            --bucket "$R2_BUCKET" \
            --source-dir data/curated \
            --releases-dir data/releases \
            --keep-snapshots "$KEEP_SNAPSHOTS"
